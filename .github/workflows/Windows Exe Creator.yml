name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: python build.windows.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tankobon-Windows
          path: dist/Tankobon/
